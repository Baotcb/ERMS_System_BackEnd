trigger:
  branches:
    include:
    - DEV
    
pr: none 
variables:
- group: SONAR_TOKEN
- name: dockerRegistryConnection
  value: 'DockerHubConnection'
- name: imageName
  value: 'baotcq/erms-api'
- name: tag
  value: '$(Build.BuildId)'
- name: solution
  value: '**/*.sln'
- name: buildConfiguration
  value: 'Release'
- name: dotNetVersion
  value: '10.x'
- name: sonarProjectKey
  value: 'EnterpriseResourcePlanningSystem_EnterpriseResourcePlanningSystem_BE'
- name: sonarOrg
  value: 'enterpriseresourceplanningsystem'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build_And_Push
  displayName: 'Đóng gói & Đẩy Docker Image'
  jobs:
  - job: Build
    displayName: 'Build Docker API'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotNetVersion)'
        includePreviewVersions: true

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: dotnet tool install --global dotnet-sonarscanner
      displayName: 'Install SonarScanner Tool'

    - script: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet sonarscanner begin /k:"$(sonarProjectKey)" \
        /o:"$(sonarOrg)" \
        /d:sonar.token="$SONAR_TOKEN_ENV" \
        /d:sonar.host.url="https://sonarcloud.io"
      displayName: 'SonarScanner Begin'
      env: 
        SONAR_TOKEN_ENV: $(SONAR_TOKEN) 

    - task: DotNetCoreCLI@2
      displayName: 'Restore Dependencies'
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - script: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN_ENV"
      displayName: 'SonarScanner End'
      env: 
        SONAR_TOKEN_ENV: $(SONAR_TOKEN)

    - task: Docker@2
      displayName: 'Build code C# và Push lên Docker Hub'
      inputs:
        containerRegistry: '$(dockerRegistryConnection)'
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)
          $(Build.SourceBranchName)

- stage: Update_Manifest
  displayName: 'Cập nhật kho hạ tầng GitOps'
  dependsOn: Build_And_Push
  condition: succeeded()
  jobs:
  - job: UpdateConfig
    displayName: 'Báo cho ArgoCD cập nhật'
    steps:
    - script: |
        set -e
        git config --global user.email "bot@erms-project.com"
        git config --global user.name "GitOps Bot"
        
        git clone https://$MY_PAT@dev.azure.com/EnterpriseResourcePlanningSystem/_git/EnterpriseResourcePlanningSystem_BE manifests
        
       
        cd manifests/erms-api/overlays/dev
        
        sed -i "s/newTag:.*/newTag: '$(tag)'/" kustomization.yaml
        git add kustomization.yaml
        git commit -m "Auto-update DEV environment to image tag: $(tag)"
        git push origin master
      displayName: 'Cập nhật Kustomize cho DEV'
      env:
        MY_PAT: $(PAT)